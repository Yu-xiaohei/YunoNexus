version: '3.8'

services:
  # Nginx 反向代理
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ../web-admin/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: always
    networks:
      - yunonexus-net

  # Go API 服务
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=yunonexus
      - DB_USER=yunonexus
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - yunonexus-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Go 隧道代理服务
  proxy:
    build:
      context: ../server
      dockerfile: Dockerfile.proxy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=yunonexus
      - DB_USER=yunonexus
      - DB_PASSWORD=${DB_PASSWORD}
      - PROXY_PORT=9443
      - TUNNEL_PORT_START=30000
      - TUNNEL_PORT_END=30100
      - API_INTERNAL_URL=http://api:8080
    ports:
      - "9443:9443"     # WSS 客户端连接
      - "30000-30100:30000-30100"  # 隧道端口范围
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - yunonexus-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=yunonexus
      - POSTGRES_USER=yunonexus
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../server/internal/database/migrations/001_init.up.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yunonexus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - yunonexus-net
    deploy:
      resources:
        limits:
          memory: 512M

  # Redis (缓存/限速)
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - yunonexus-net

volumes:
  postgres-data:
  redis-data:

networks:
  yunonexus-net:
    driver: bridge
